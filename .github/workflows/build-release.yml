name: MH Tour APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    name: Build MH Tour Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify MH Tour project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/mhtour/audio/MainActivity.kt

          echo "Android project ditemukan."

      - name: Verify LiveKit configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'io.livekit:livekit-android:2.28.2' \
            android/app/build.gradle.kts

          grep -q 'TokenSource.fromDevelopmentTokenServer("mhtour-19kg8e")' \
            android/app/src/main/java/com/mhtour/audio/MainActivity.kt

          echo "Konfigurasi LiveKit ditemukan dan tidak diubah."

      - name: Verify Donasi Seikhlasnya
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/src/main/res/drawable/donation_qr.png

          grep -q 'saweria.co/denimurdhan' \
            android/app/src/main/java/com/mhtour/audio/MainActivity.kt

          echo "Fitur Donasi dan QR Code ditemukan."

      - name: Create temporary release keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/mh-tour-release.jks" \
            -storetype JKS \
            -alias mh-tour-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=MH Tour, OU=Mobile, O=MH Tour, L=Indonesia, ST=West Java, C=ID"

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PMH_KEYSTORE_FILE="$RUNNER_TEMP/mh-tour-release.jks" \
            -PMH_KEYSTORE_PASSWORD=changeit \
            -PMH_KEY_ALIAS=mh-tour-release \
            -PMH_KEY_PASSWORD=changeit \
            clean assembleRelease

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "======================================"
          echo "MH TOUR RELEASE APK BERHASIL DIBUAT"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-V5.4-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
